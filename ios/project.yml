name: StuhiApp
options:
  bundleIdPrefix: org.stuhi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # STUHI's paid Organization team. NOT the personal DQ54FKG6B4 — that team
    # gets 7-day profiles and never gets a distribution certificate.
    DEVELOPMENT_TEAM: "Q485H7YK66"
    CODE_SIGN_STYLE: Automatic

targets:
  StuhiApp:
    type: application
    platform: iOS
    sources:
      - path: StuhiApp
        # The template declares `enum Config` too — compiling both is a
        # redeclaration error. It exists to be copied, not built.
        excludes:
          - "Config.example.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.stuhi.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: STUHI
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # The scanner needs the camera. The string is what the reviewer reads.
        INFOPLIST_KEY_NSCameraUsageDescription: "STUHI uses the camera to scan admission QR codes at the door and at meal points."
        # HTTPS/TLS only, which is exempt — stops App Store Connect asking the
        # export compliance question on every upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
