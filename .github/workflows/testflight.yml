# Every merge to main → a new TestFlight build. The App Store is a separate,
# manual step for major versions only (docs/RELEASING.md).
name: TestFlight

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/testflight.yml"]
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  ship:
    # Only what Momin lands on main ships. Anyone else's direct push builds nothing.
    if: github.actor == 'Momin010'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # run 12, attempt 1 → 121. Always rises, and a re-run never collides.
      BUILD_NUMBER: ${{ github.run_number }}${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Config.swift
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          mkdir -p ~/.stuhi-app
          printf 'SUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > ~/.stuhi-app/env
          ./scripts/make-config.sh

      - name: Signing
        env:
          DIST_P12: ${{ secrets.DIST_P12 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          PROVISION_PROFILE: ${{ secrets.PROVISION_PROFILE }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KC="$RUNNER_TEMP/ci.keychain-db"; KCPASS=$(openssl rand -hex 16)
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          echo "$DIST_P12" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" login.keychain-db

          # Xcode 16+ reads UserData; older Xcodes read MobileDevice. Both, to be safe.
          for d in ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles ~/Library/MobileDevice/Provisioning\ Profiles; do
            mkdir -p "$d"; echo "$PROVISION_PROFILE" | base64 -d > "$d/stuhi.mobileprovision"
          done

          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8

      - name: Archive
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version
          xcodebuild -project StuhiApp.xcodeproj -scheme StuhiApp -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/StuhiApp.xcarchive \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="STUHI App Store CI" \
            archive | tail -40
          test -d build/StuhiApp.xcarchive

      - name: Export
        working-directory: ios
        run: |
          xcodebuild -exportArchive -archivePath build/StuhiApp.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/export | tail -20
          test -f build/export/StuhiApp.ipa

      - name: Upload to TestFlight
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app -f build/export/StuhiApp.ipa -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Build $BUILD_NUMBER uploaded. TestFlight shows it after Apple processes it (~10-20 min)." >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up signing
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/ci.keychain-db" || true
          rm -rf ~/.appstoreconnect "$RUNNER_TEMP/dist.p12"
